name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)

          # Semantic versioning from commit message prefix
          # BREAKING: or bump: → major, feat: → minor, default → patch
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qiE '^(BREAKING|bump):'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qi '^feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG (from: $MSG)"

      - name: Inject version into Info.plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i '' "s|<string>0.1.0</string>|<string>${VERSION}</string>|g" Resources/Info.plist

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64

      - name: Create universal binary
        run: |
          lipo -create \
            .build/arm64-apple-macosx/release/sotto \
            .build/x86_64-apple-macosx/release/sotto \
            -output sotto-universal

      - name: Create .app bundle
        run: |
          APP="sotto.app"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"
          cp sotto-universal "${APP}/Contents/MacOS/sotto"
          cp Resources/Info.plist "${APP}/Contents/Info.plist"
          cp Resources/AppIcon.icns "${APP}/Contents/Resources/AppIcon.icns"

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign - --identifier com.ugurcandede.sotto sotto.app

      - name: Package
        run: |
          zip -r sotto-macos.zip sotto.app
          SHA256=$(shasum -a 256 sotto-macos.zip | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: sotto ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            sotto-macos.zip
          body: |
            **SHA256:** `${{ env.SHA256 }}`

            ### Install
            ```bash
            brew tap ugurcandede/tap
            brew install --cask sotto
            ```

            Or download `sotto-macos.zip`, extract, and move `sotto.app` to Applications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew cask
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/ugurcandede/homebrew-tap.git /tmp/homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"
          # First release: seed the cask from the template in this repo.
          if [ ! -f /tmp/homebrew-tap/Casks/sotto.rb ]; then
            cp packaging/homebrew/sotto.rb /tmp/homebrew-tap/Casks/sotto.rb
          fi
          cd /tmp/homebrew-tap
          sed -i '' "s|version \".*\"|version \"${VERSION}\"|" Casks/sotto.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Casks/sotto.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sotto.rb
          git commit -m "Update sotto cask to v${VERSION}"
          git push
